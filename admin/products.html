<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvy Cakes - Manage Products</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Admin Navigation -->
    <nav class="admin-nav">
        <div class="admin-nav-container">
            <div class="admin-nav-logo">
                <span class="logo-text">👑 MARVY CAKES</span>
                <span class="logo-sub">Admin Panel</span>
            </div>
            <ul class="admin-nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="orders.html">Orders</a></li>
            </ul>
            <button class="admin-logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="admin-header">
            <h1>Manage Products</h1>
            <p>Add, edit, or remove products from your store</p>
            <button class="btn-primary add-product-btn" id="showAddProductBtn">+ Add New Product</button>
        </div>

        <!-- Add/Edit Product Form -->
        <div class="admin-form-container" id="productFormContainer" style="display:none;">
            <h3 id="formTitle">Add New Product</h3>
            <form id="productForm" enctype="multipart/form-data">
                <input type="hidden" id="editProductId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" placeholder="e.g., Classic Birthday Cake" required>
                    </div>
                    <div class="form-group">
                        <label>Price (₦) *</label>
                        <input type="number" id="productPrice" placeholder="25000" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="productCategory" class="category-select">
                            <option value="">Select category...</option>
                            <option value="Cakes">🎂 Cakes</option>
                            <option value="Hampers">📦 Hampers</option>
                            <option value="Food">🍱 Food</option>
                            <option value="Surprise">🎁 Surprise Packages</option>
                            <option value="Sign-Out">🎓 Sign-Out Packages</option>
                            <option value="Decoration">🎈 Event Decoration</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stock</label>
                        <input type="number" id="productStock" placeholder="10" value="10">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription" placeholder="Describe your product..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Product Image</label>
                    <div class="image-upload-container">
                        <input type="file" id="productImage" accept="image/*">
                        <div id="imagePreview" class="image-preview"></div>
                        <p class="image-hint">Upload a product image (JPG, PNG, WebP)</p>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="saveProductBtn">Save Product</button>
                    <button type="button" class="btn-secondary" id="cancelProductBtn">Cancel</button>
                </div>
            </form>
        </div>

        <!-- Products List -->
        <div class="admin-products-list">
            <h3>All Products</h3>
            <div id="productsList">
                <p class="loading">Loading products...</p>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script>
        // Check login
        document.addEventListener('DOMContentLoaded', function() {
            const loggedIn = localStorage.getItem('adminLoggedIn');
            if (!loggedIn) {
                window.location.href = 'login.html';
                return;
            }
            loadProducts();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        });

        // Show/hide add product form
        document.getElementById('showAddProductBtn').addEventListener('click', function() {
            const form = document.getElementById('productFormContainer');
            if (form.style.display === 'none' || form.style.display === '') {
                form.style.display = 'block';
                document.getElementById('formTitle').textContent = 'Add New Product';
                document.getElementById('saveProductBtn').textContent = 'Save Product';
                document.getElementById('editProductId').value = '';
                document.getElementById('productForm').reset();
                document.getElementById('imagePreview').innerHTML = '';
            } else {
                form.style.display = 'none';
            }
        });

        document.getElementById('cancelProductBtn').addEventListener('click', function() {
            document.getElementById('productFormContainer').style.display = 'none';
            document.getElementById('productForm').reset();
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('editProductId').value = '';
        });

        // Image preview
        document.getElementById('productImage').addEventListener('change', function(e) {
            const preview = document.getElementById('imagePreview');
            const file = e.target.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Product preview">`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = '';
            }
        });

        // Load products
        async function loadProducts() {
            const container = document.getElementById('productsList');
            
            try {
                const products = await getProducts();
                console.log('Loaded products:', products);
                
                if (products && products.length > 0) {
                    container.innerHTML = `
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th>Category</th>
                                    <th>Stock</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${products.map(product => `
                                    <tr>
                                        <td>
                                            ${product.image_url ? 
                                                `<img src="${product.image_url}" alt="${product.name}" class="admin-product-image">` :
                                                '<span class="no-image">📦</span>'
                                            }
                                        </td>
                                        <td><strong>${product.name}</strong></td>
                                        <td>₦${product.price.toLocaleString()}</td>
                                        <td>${product.category || '-'}</td>
                                        <td>${product.stock || 0}</td>
                                        <td>
                                            <button class="admin-btn admin-btn-edit" onclick="editProduct('${product.id}')">
                                                ✏️ Edit
                                            </button>
                                            <button class="admin-btn admin-btn-delete" onclick="deleteProduct('${product.id}')">
                                                🗑️ Delete
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                } else {
                    container.innerHTML = '<p class="no-products">No products yet. Add your first product above!</p>';
                }
            } catch (error) {
                console.error('Error loading products:', error);
                container.innerHTML = '<p class="error-msg">Error loading products. Please refresh.</p>';
            }
        }

        // Edit product
        async function editProduct(id) {
            console.log('Editing product with ID:', id);
            
            try {
                const product = await getProductById(id);
                console.log('Product data:', product);
                
                if (!product) {
                    showToast('Error', 'Product not found. It may have been deleted.', '❌', 'error');
                    return;
                }

                // Fill form with product data
                document.getElementById('editProductId').value = product.id;
                document.getElementById('productName').value = product.name || '';
                document.getElementById('productPrice').value = product.price || '';
                document.getElementById('productCategory').value = product.category || '';
                document.getElementById('productStock').value = product.stock || 0;
                document.getElementById('productDescription').value = product.description || '';
                
                // Show existing image
                const preview = document.getElementById('imagePreview');
                if (product.image_url) {
                    preview.innerHTML = `<img src="${product.image_url}" alt="Current product image">`;
                } else {
                    preview.innerHTML = '';
                }

                document.getElementById('formTitle').textContent = 'Edit Product';
                document.getElementById('saveProductBtn').textContent = 'Update Product';
                document.getElementById('productFormContainer').style.display = 'block';
                
                // Scroll to form
                document.getElementById('productFormContainer').scrollIntoView({ behavior: 'smooth' });
                
            } catch (error) {
                console.error('Error in editProduct:', error);
                showToast('Error', 'Could not load product details.', '❌', 'error');
            }
        }

        // Delete product
        async function deleteProduct(id) {
            console.log('Deleting product with ID:', id);
            
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const { error } = await supabase
                    .from('product')
                    .delete()
                    .eq('id', id);

                if (error) {
                    console.error('Delete error:', error);
                    showToast('Error', 'Failed to delete product.', '❌', 'error');
                    return;
                }

                showToast('Deleted', 'Product removed successfully!', '🗑️', 'success');
                loadProducts();

            } catch (error) {
                console.error('Error in deleteProduct:', error);
                showToast('Error', 'Something went wrong.', '❌', 'error');
            }
        }

        // Save product (Add or Update)
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const editId = document.getElementById('editProductId').value;
            const name = document.getElementById('productName').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);
            const category = document.getElementById('productCategory').value.trim();
            const stock = parseInt(document.getElementById('productStock').value) || 0;
            const description = document.getElementById('productDescription').value.trim();
            const imageFile = document.getElementById('productImage').files[0];

            if (!name || !price) {
                showToast('Missing Fields', 'Please fill in name and price.', '⚠️', 'error');
                return;
            }

            try {
                let imageUrl = null;

                // Upload image if selected
                if (imageFile) {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${Date.now()}.${fileExt}`;
                    const filePath = `products/${fileName}`;

                    const { error: uploadError } = await supabase.storage
                        .from('product-images')
                        .upload(filePath, imageFile);

                    if (uploadError) {
                        console.error('Upload error:', uploadError);
                        showToast('Upload Failed', 'Could not upload image. Make sure bucket exists.', '❌', 'error');
                        return;
                    }

                    const { data: urlData } = supabase.storage
                        .from('product-images')
                        .getPublicUrl(filePath);

                    imageUrl = urlData.publicUrl;
                }

                let result;
                
                if (editId) {
                    // Update existing product
                    const updateData = {
                        name: name,
                        price: price,
                        category: category || null,
                        stock: stock,
                        description: description || null
                    };
                    
                    if (imageUrl) {
                        updateData.image_url = imageUrl;
                    }

                    result = await supabase
                        .from('product')
                        .update(updateData)
                        .eq('id', editId);
                } else {
                    // Add new product
                    result = await supabase
                        .from('product')
                        .insert([{
                            name: name,
                            price: price,
                            category: category || null,
                            stock: stock,
                            description: description || null,
                            image_url: imageUrl
                        }]);
                }

                if (result.error) {
                    console.error('Error saving product:', result.error);
                    showToast('Error', `Failed to ${editId ? 'update' : 'add'} product.`, '❌', 'error');
                } else {
                    showToast('Success', `Product ${editId ? 'updated' : 'added'} successfully!`, '✅', 'success');
                    document.getElementById('productFormContainer').style.display = 'none';
                    document.getElementById('productForm').reset();
                    document.getElementById('imagePreview').innerHTML = '';
                    document.getElementById('editProductId').value = '';
                    loadProducts();
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error', 'Something went wrong.', '❌', 'error');
            }
        });
    </script>
</body>
</html>
