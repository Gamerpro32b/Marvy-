<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvy Cakes - Forgot Password</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- ====== AUTHENTICATION COMPOSITION ====== -->
    <div class="auth-composition">

        <!-- ====== BACKGROUND LAYER ====== -->
        <div class="auth-bg">
            <div class="auth-bg-gradient"></div>
            <div class="auth-bg-light light-1"></div>
            <div class="auth-bg-light light-2"></div>
            <div class="auth-bg-light light-3"></div>
            <div class="auth-bg-shape curve-1"></div>
            <div class="auth-bg-shape curve-2"></div>
            <div class="auth-bg-shape curve-3"></div>
            <div class="auth-bg-texture"></div>
        </div>

        <!-- ====== GLASS PANEL ====== -->
        <div class="auth-glass-panel">

            <!-- Brand -->
            <div class="auth-brand">
                <span class="auth-brand-main">MARVY CAKES</span>
                <span class="auth-brand-sub">Events &amp; More</span>
            </div>

            <!-- Heading -->
            <div class="auth-heading">
                <h1>Reset Password</h1>
                <p>Enter your email to receive a reset link</p>
            </div>

            <!-- Form -->
            <form class="auth-form" id="resetForm">

                <!-- Email -->
                <div class="auth-field">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" placeholder="jane@example.com" required autocomplete="email">
                    <span class="auth-field-line"></span>
                </div>

                <!-- Error / Success -->
                <div id="resetError" class="auth-error" style="display:none;"></div>
                <div id="resetSuccess" class="auth-success" style="display:none;"></div>

                <!-- Button -->
                <button type="submit" class="auth-btn" id="resetBtn">
                    Send Reset Link
                </button>

                <!-- Switch -->
                <p class="auth-switch">
                    <a href="login.html">← Back to Sign In</a>
                </p>

            </form>
        </div>

    </div>

    <!-- ====== JAVASCRIPT ====== -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('resetEmail').value.trim();
            const errorEl = document.getElementById('resetError');
            const successEl = document.getElementById('resetSuccess');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!email) {
                errorEl.textContent = 'Please enter your email address.';
                errorEl.style.display = 'block';
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.textContent = '⏳ Sending...';
            btn.disabled = true;

            try {
                const result = await resetPassword(email);

                if (result.error) {
                    errorEl.textContent = result.error.message || 'Failed to send reset link. Please try again.';
                    errorEl.style.display = 'block';
                    btn.textContent = 'Send Reset Link';
                    btn.disabled = false;
                    return;
                }

                successEl.innerHTML = '✅ Reset link sent!<br><small>Please check your email for instructions.</small>';
                successEl.style.display = 'block';
                btn.textContent = '✅ Sent!';
                btn.disabled = true;

                // Clear the email field after success
                document.getElementById('resetEmail').value = '';

                // Allow resending after 10 seconds
                setTimeout(() => {
                    btn.textContent = 'Send Reset Link';
                    btn.disabled = false;
                }, 10000);

            } catch (error) {
                console.error('Reset error:', error);
                errorEl.textContent = 'Something went wrong. Please try again.';
                errorEl.style.display = 'block';
                btn.textContent = 'Send Reset Link';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
